services:
  # VishwaGuru Frontend Static Site
  - type: web
    name: vishwaguru-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # VishwaGuru Backend Service
  - type: web
    name: vishwaguru-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    # Migrations run before the server starts, and a failure aborts the boot
    # rather than letting the service answer 500s against a schema that was
    # never created.
    #
    # NOT preDeployCommand: Render only honours that on paid instance types and
    # silently ignores it on the free tier, so the migrations never ran at all.
    # On a paid plan, move this to preDeployCommand -- it belongs there, and
    # running it in startCommand means every replica races to apply it.
    startCommand: "alembic upgrade head && python start-backend.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        fromService:
          type: web
          name: vishwaguru-backend
          property: port
      # Repo root, not backend/. Every intra-project import is now fully
      # qualified as `backend.x`, so backend/ must NOT be on sys.path -- having
      # it there let the same module load twice under two names.
      - key: PYTHONPATH
        value: .
      # Administrative key for the two endpoints that change state officials
      # act on (grievance escalation, issue verification). At least 32
      # characters. If unset, those endpoints fail closed with 503.
      - key: ADMIN_API_KEY
        sync: false
      # Optional: verifies bearer tokens used for user attribution.
      - key: JWT_SECRET
        sync: false
      # Required API Keys (must be set in Render dashboard)
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Frontend URL (must be set to your Netlify deployment URL)
      - key: FRONTEND_URL
        sync: false
      # Database URL (use Neon, Supabase, or similar)
      - key: DATABASE_URL
        sync: false
      # Application settings
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      # CORS settings
      - key: CORS_ORIGINS
        sync: false  # Set to your frontend URL
      # File upload settings
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/jpg,video/mp4
      # Rate limiting. These were declared here long before anything enforced
      # them; slowapi now reads them at startup.
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: MAX_REQUESTS_PER_MINUTE
        value: 60
      # Routes that call a paid inference API get a tighter bucket.
      - key: AI_REQUESTS_PER_MINUTE
        value: 12
      # Counters live in-process, which is correct for one instance. Point this
      # at redis:// before scaling to more than one.
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      # Leave unset on the web service. The Telegram poller must run in exactly
      # one process: Telegram answers HTTP 409 to a second long-poll on the same
      # token, so setting this on a multi-worker web service breaks the bot.
      - key: RUN_TELEGRAM_BOT
        value: false
    healthCheckPath: /health
    # Add disk for SQLite database (if using SQLite)
    disk:
      name: vishwaguru-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
