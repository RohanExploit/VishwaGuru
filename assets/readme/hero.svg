<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" aria-labelledby="vg-title vg-desc" role="img" viewBox="0 0 1200 360"><title id="vg-title">VishwaGuru</title><desc id="vg-desc">VishwaGuru — AI-powered civic action platform. Citizens report issues; AI generates WhatsApp messages, emails, and action plans.</desc><defs><linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#08090D"/><stop offset="100%" stop-color="#0D1117"/></linearGradient><linearGradient id="accentLine" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#FF6B00" stop-opacity="0"/><stop offset="30%" stop-color="#FF6B00"/><stop offset="100%" stop-color="#FF6B00" stop-opacity=".1"/></linearGradient><linearGradient id="nodeGlow" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#FF6B00" stop-opacity=".15"/><stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/></linearGradient><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><clipPath id="heroClip"><rect width="1200" height="360" rx="20"/></clipPath></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="20"/><g clip-path="url(#heroClip)" opacity=".04"><line x1="0" x2="1200" y1="90" y2="90" stroke="#F5F5F0" stroke-width="1"/><line x1="0" x2="1200" y1="180" y2="180" stroke="#F5F5F0" stroke-width="1"/><line x1="0" x2="1200" y1="270" y2="270" stroke="#F5F5F0" stroke-width="1"/><line x1="300" x2="300" y1="0" y2="360" stroke="#F5F5F0" stroke-width="1"/><line x1="600" x2="600" y1="0" y2="360" stroke="#F5F5F0" stroke-width="1"/><line x1="900" x2="900" y1="0" y2="360" stroke="#F5F5F0" stroke-width="1"/></g><rect width="180" height="2" x="56" y="36" fill="url(#accentLine)" rx="1"/><g id="title-block"><text x="0" y="18" fill="#FF6B00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="3" opa