<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="vg-title vg-desc">
  <title id="vg-title">VishwaGuru</title>
  <desc id="vg-desc">VishwaGuru — AI-powered civic action platform. Citizens report issues; AI generates WhatsApp messages, emails, and action plans.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="heroClip">
      <rect width="1200" height="360" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#heroClip)" opacity="0.04">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#F5F5F0" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#F5F5F0" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#F5F5F0" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="360" stroke="#F5F5F0" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#F5F5F0" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="360" stroke="#F5F5F0" stroke-width="1"/>
  </g>

  <!-- Saffron accent bar at top -->
  <rect x="56" y="36" width="180" height="2" rx="1" fill="url(#accentLine)"/>

  <!-- Left title block -->
  <g id="title-block" transform="translate(56, 56)">
    <!-- Category eyebrow -->
    <text x="0" y="18"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" font-weight="500" letter-spacing="3"
          fill="#FF6B00" opacity="0.9">AI CIVIC PLATFORM · INDIA</text>

    <!-- Project name -->
    <text x="0" y="72"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="62" font-weight="700" letter-spacing="-1"
          fill="#F5F5F0">Vishwa</text>
    <text x="0" y="136"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="62" font-weight="700" letter-spacing="-1"
          fill="#FF6B00">Guru</text>

    <!-- Tagline -->
    <text x="0" y="174"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="400"
          fill="#9CA3AF">Empowering every Indian citizen with AI-drafted</text>
    <text x="0" y="196"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="400"
          fill="#9CA3AF">grievances, messages, and civic action plans.</text>

    <!-- Metadata row -->
    <g transform="translate(0, 230)">
      <!-- Python badge -->
      <rect width="74" height="22" rx="4" fill="#1E2228"/>
      <text x="10" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#6B7280">Python</text>
      <text x="48" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#FF6B00">3.8+</text>

      <!-- React badge -->
      <rect x="82" width="68" height="22" rx="4" fill="#1E2228"/>
      <text x="92" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#6B7280">React</text>
      <text x="122" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#1A7FE8">18+</text>

      <!-- FastAPI badge -->
      <rect x="158" width="72" height="22" rx="4" fill="#1E2228"/>
      <text x="168" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#6B7280">FastAPI</text>

      <!-- License badge -->
      <rect x="238" width="72" height="22" rx="4" fill="#1E2228"/>
      <text x="248" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#6B7280">AGPL-3.0</text>
    </g>
  </g>

  <!-- Right: AI pipeline diagram -->
  <g id="project-proof" transform="translate(680, 40)">

    <!-- Pipeline title -->
    <text x="200" y="18" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" letter-spacing="2" fill="#6B7280">HOW IT WORKS</text>

    <!-- Node 1: Citizen / Issue -->
    <g transform="translate(80, 36)">
      <rect width="120" height="52" rx="8" fill="#131720" stroke="#2A3040" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="10" fill="#6B7280">INPUT</text>
      <text x="60" y="38" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="13" font-weight="600" fill="#F5F5F0">🗣 Citizen</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(80, 110)">
      <line x1="60" y1="0" x2="60" y2="28" stroke="#2A3040" stroke-width="1.5"/>
      <polygon points="60,32 55,22 65,22" fill="#FF6B00" opacity="0.7"/>
    </g>

    <!-- Node 2: Issue Report -->
    <g transform="translate(40, 152)">
      <rect width="200" height="60" rx="8" fill="#131720" stroke="#FF6B00" stroke-width="1" opacity="0.8"/>
      <rect width="200" height="60" rx="8" fill="url(#nodeGlow)"/>
      <text x="100" y="18" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="10" fill="#FF6B00" letter-spacing="1">REPORT ISSUE</text>
      <text x="100" y="38" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#D1D5DB">Web UI · Telegram Bot</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(80, 224)">
      <line x1="60" y1="0" x2="60" y2="28" stroke="#2A3040" stroke-width="1.5"/>
      <polygon points="60,32 55,22 65,22" fill="#FF6B00" opacity="0.7"/>
    </g>

    <!-- Node 3: Gemini AI -->
    <g transform="translate(40, 264)">
      <rect width="200" height="60" rx="8" fill="#0F1824" stroke="#1A7FE8" stroke-width="1.5"/>
      <text x="100" y="18" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="10" fill="#1A7FE8" letter-spacing="1">AI ENGINE</text>
      <text x="100" y="38" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#D1D5DB">Google Gemini API</text>
    </g>

    <!-- Horizontal branch: outputs -->
    <g transform="translate(240, 284)">
      <line x1="0" y1="10" x2="70" y2="10" stroke="#2A3040" stroke-width="1.5"/>

      <!-- Action plan output -->
      <g transform="translate(70, -26)">
        <rect width="100" height="28" rx="5" fill="#1A1F2B" stroke="#2A3040" stroke-width="1"/>
        <text x="50" y="18" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#9CA3AF">📧 Email Draft</text>
      </g>

      <line x1="70" y1="10" x2="70" y2="22" stroke="#2A3040" stroke-width="1"/>

      <!-- WhatsApp output -->
      <g transform="translate(70, 22)">
        <rect width="100" height="28" rx="5" fill="#1A1F2B" stroke="#2A3040" stroke-width="1"/>
        <text x="50" y="18" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#9CA3AF">📱 WhatsApp</text>
      </g>
    </g>

  </g>

  <!-- Bottom saffron accent line -->
  <rect x="0" y="354" width="1200" height="6" rx="0" fill="#FF6B00" opacity="0.12"/>
  <rect x="0" y="354" width="300" height="6" rx="0" fill="#FF6B00" opacity="0.3"/>

</svg>
