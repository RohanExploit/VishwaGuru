<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">VishwaGuru Tech Stack</title>
  <desc id="stack-desc">Frontend: React 18 + Vite + Tailwind CSS. Backend: Python + FastAPI + SQLite/PostgreSQL. AI: Google Gemini. Bots: Telegram. Deploy: Firebase, Netlify, Render.</desc>

  <rect width="1200" height="140" rx="16" fill="#0D1117"/>
  <rect x="0" y="0" width="1200" height="1" rx="0" fill="#FF6B00" opacity="0.25"/>

  <!-- Section label -->
  <text x="600" y="30" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="10" letter-spacing="3" fill="#FF6B00">TECH STACK</text>

  <!-- Stack items -->
  <!-- React -->
  <g transform="translate(52, 48)">
    <rect width="148" height="56" rx="8" fill="#131720" stroke="#1E2632" stroke-width="1"/>
    <text x="74" y="20" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#6B7280">FRONTEND</text>
    <text x="74" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#61DAFB">React · Vite · Tailwind</text>
  </g>

  <!-- FastAPI -->
  <g transform="translate(226, 48)">
    <rect width="148" height="56" rx="8" fill="#131720" stroke="#1E2632" stroke-width="1"/>
    <text x="74" y="20" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#6B7280">BACKEND</text>
    <text x="74" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#009688">Python · FastAPI</text>
  </g>

  <!-- Database -->
  <g transform="translate(400, 48)">
    <rect width="148" height="56" rx="8" fill="#131720" stroke="#1E2632" stroke-width="1"/>
    <text x="74" y="20" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#6B7280">DATABASE</text>
    <text x="74" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#336791">SQLite · PostgreSQL</text>
  </g>

  <!-- Gemini AI -->
  <g transform="translate(574, 48)">
    <rect width="148" height="56" rx="8" fill="#0F1824" stroke="#1A7FE8" stroke-width="1"/>
    <text x="74" y="20" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#1A7FE8">AI MODEL</text>
    <text x="74" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#4285F4">Google Gemini</text>
  </g>

  <!-- Telegram -->
  <g transform="translate(748, 48)">
    <rect width="148" height="56" rx="8" fill="#131720" stroke="#1E2632" stroke-width="1"/>
    <text x="74" y="20" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#6B7280">BOT INTERFACE</text>
    <text x="74" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#26A5E4">Telegram Bot</text>
  </g>

  <!-- Deploy -->
  <g transform="translate(922, 48)">
    <rect width="228" height="56" rx="8" fill="#131720" stroke="#FF6B00" stroke-width="1" opacity="0.7"/>
    <text x="114" y="20" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="10" fill="#FF6B00">DEPLOYMENT</text>
    <text x="114" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" fill="#F5F5F0">Firebase · Netlify · Render</text>
