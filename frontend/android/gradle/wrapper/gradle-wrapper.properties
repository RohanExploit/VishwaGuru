distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# 10 minutes, not the scaffolded 10 seconds. The wrapper applies this as a
# socket READ timeout, so on a slow or bursty link it aborts a partially
# downloaded distribution rather than waiting -- the ~230MB download here
# failed at 50% with SocketTimeoutException and started over each retry.
networkTimeout=600000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
