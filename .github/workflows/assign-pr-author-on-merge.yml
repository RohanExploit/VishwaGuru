name: Assign PR author on merge

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Assign PR to its author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Get the PR author's username
            const author = pr.user.login;

            if (author.endsWith("[bot]")) {
              console.log(`Skipping bot author @${author} for PR #${pr.number}`);
              return;
            }

            // Assign PR to the author
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author],
              });
            } catch (error) {
              if (error.status === 403 || error.status === 422) {
                console.log(
                  `Skipping assignment for @${author} on PR #${pr.number}: ${error.message}`
                );
                return;
              }
              throw error;
            }

            console.log(`PR #${pr.number} assigned to @${author}`);
