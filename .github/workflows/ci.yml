name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Format check (ruff)
        run: ruff format --check backend/ tests/

      - name: Test
        run: pytest -q
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./data/test.db

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-node${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 7

  docker:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vishwaguru-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check /health
        run: |
          docker run -d --name api -p 8000:8000             -e ENVIRONMENT=test             -e RUN_TELEGRAM_BOT=false             vishwaguru-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Container healthy after ${i}s"
              curl -sS http://127.0.0.1:8000/health
              docker rm -f api
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container did not become healthy within 30s"
          docker logs api
          docker rm -f api
          exit 1

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Bandit (SAST)
        run: bandit -r backend/ -ll -x backend/tests

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r backend/requirements.txt --strict
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
