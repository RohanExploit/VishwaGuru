name: Automated CI/CD Pipeline

# DISABLED daily cron on 2026-08-19.
#
# This workflow ran vishwaguru_pipeline.py, which squash-merges open pull
# requests through the GitHub API. Its gate did not check what it appeared to:
#
#   * quality check = PR title >= 5 characters and body >= 10 characters
#   * security check = grep the diff for a keyword list
#   * "run tests" = `npm test` against the ROOT package.json, whose script is
#     `jest tests/`. That collects one TypeScript file. It never ran the backend
#     pytest suite or the frontend Jest suite.
#   * "deploy and health check" = no docker-compose.yml and no manage.py exist,
#     so it fell through to `python -m http.server`, then confirmed that static
#     file server answered 200 -- and treated that as the application being
#     healthy.
#
# So it merged to main daily on evidence that proved nothing. Together with
# auto-merge-jules.yml (deleted in the same pass) this is how the repository
# reached a state where the backend could not import, the frontend could not
# build, and 15 endpoints the frontend called did not exist.
#
# Merges now go through .github/workflows/ci.yml and human review. This is kept
# for manual dispatch only, for the deployment steps.

on:
  workflow_dispatch:

jobs:
  auto-deploy:
    runs-on: ubuntu-latest

    # The pipeline squash-merges open PRs through the REST API. Without these
    # the default GITHUB_TOKEN is read-only and every merge came back
    # "Resource not accessible by integration".
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for full git history and local syncs

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Execute VishwaGuru Pipeline (PR Review, Merge, Test, Deploy)
        env:
          # Use GITHUB_TOKEN provided by GitHub Actions for API calls
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_REPO_PATH: ${{ github.workspace }}
          DEPLOYMENT_PORT: 8000
        run: |
          python vishwaguru_pipeline.py

      - name: Upload Pipeline Logs and Report
        if: always() # Ensure logs are uploaded even if pipeline fails
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-execution-logs
          path: |
            pipeline_execution.log
            pipeline_report.json
            
      # Skipped unless SLACK_WEBHOOK_URL is set. Previously this ran on every
      # failure and, with no webhook configured, died with "Need to provide at
      # least one botToken or webhookUrl" -- turning one red step into two.
      - name: Send Slack Notification on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 *VishwaGuru Auto-Deploy Pipeline Failed!*\nCheck the logs for security violations or test failures: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Pipeline Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Required by the action when posting to an incoming webhook.
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
